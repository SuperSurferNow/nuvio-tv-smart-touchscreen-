name: Build Flatpak

on:
  push:
    branches: [main, 'ccr-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and run checks
        run: |
          npm ci
          npm test

      - name: Build unpacked Electron app
        run: npm run dist:dir

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.SuperSurferNow.NuvioTVInstallerTouch.yml
          flatpak build-bundle repo NuvioTVInstaller-Touch.flatpak io.github.SuperSurferNow.NuvioTVInstallerTouch

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioTVInstaller-Touch-flatpak
          path: NuvioTVInstaller-Touch.flatpak

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" NuvioTVInstaller-Touch.flatpak --generate-notes || gh release upload "$GITHUB_REF_NAME" NuvioTVInstaller-Touch.flatpak --clobber
